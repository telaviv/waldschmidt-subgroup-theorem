name = "LSG"
version = "0.1.0"
keywords = ["math", "transcendence"]
defaultTargets = ["LSG"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LSG"

[[require]]
name = "StrongSix"
git = "https://github.com/telaviv/strong-six-exponentials"
rev = "b7f16499df6fa26840c72c1af0121f2ac4a159b5"
